<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Consulting Inc. | Web Development, Marketing & Automation</title>
    <meta
      name="description"
      content="Consulting Inc. helps businesses attract customers, improve digital experiences, automate workflows, and manage operations through web development, digital marketing, CRM, and business systems."
    />
    <meta
      name="keywords"
      content="Consulting Inc, web development, digital marketing, CRM automation, business automation, inventory management systems, sales systems, website development"
    />
    <meta name="author" content="Consulting Inc." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#8B5CF6" />

    <!-- Website icon -->
    <link rel="icon" type="image/jpeg" href="/lalal.jpg" />
    <link rel="apple-touch-icon" href="/lalal.jpg" />

    <!-- Open Graph: Google-independent social sharing metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Consulting Inc." />
    <meta
      property="og:title"
      content="Consulting Inc. | Digital Solutions for Growing Businesses"
    />
    <meta
      property="og:description"
      content="We help businesses attract customers, manage relationships, and run operations more efficiently through technology."
    />
    <meta property="og:image" content="https://YOUR-DOMAIN.com/lalal.jpg" />
    <meta property="og:image:alt" content="Consulting Inc. logo" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X sharing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Consulting Inc. | Digital Solutions for Growing Businesses"
    />
    <meta
      name="twitter:description"
      content="Web development, digital marketing, CRM automation, and business systems designed to help businesses grow."
    />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/lalal.jpg" />
    <meta name="twitter:image:alt" content="Consulting Inc. logo" />

    <!-- Canonical URL: replace with your real website address -->
    <link rel="canonical" href="https://YOUR-DOMAIN.com/" />

    <meta name="format-detection" content="telephone=no" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
